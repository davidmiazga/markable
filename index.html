<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markable</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Custom title bar: drag region with document title -->
    <div id="titlebar" data-tauri-drag-region>
      <span id="titlebar-title" data-tauri-drag-region>Untitled</span>
    </div>

    <!--
      Tab strip: permanent element below the title bar. TabManager locates this
      via document.getElementById("tab-strip") in init(). It is never removed
      from the DOM; vertical mode hides it via CSS (display:none) and the
      VerticalTabStrip renderer inserts its own element into #app-row instead.
    -->
    <div id="tab-strip"></div>

    <!-- Main application container -->
    <div id="app">
      <!-- Editor container: CodeMirror will mount here -->
      <div
        id="editor"
        role="textbox"
        aria-label="Markdown editor for Markable"
      ></div>
      <div id="statusbar" class="hidden">
        <div class="statusbar-left"></div>
        <div class="statusbar-center"></div>
        <div class="statusbar-right"></div>
      </div>
    </div>
  </body>
</html>
