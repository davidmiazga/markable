<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markable</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Custom title bar: drag region with document title -->
    <div id="titlebar" data-tauri-drag-region>
      <span id="titlebar-title" data-tauri-drag-region>Untitled</span>
    </div>

    <!-- Main application container -->
    <div id="app">
      <!-- Editor container: CodeMirror will mount here -->
      <div
        id="editor"
        role="textbox"
        aria-label="Markdown editor for Markable"
      ></div>
      <div id="statusbar" class="hidden">
        <div class="statusbar-left"></div>
        <div class="statusbar-center"></div>
        <div class="statusbar-right"></div>
      </div>
    </div>
  </body>
</html>
